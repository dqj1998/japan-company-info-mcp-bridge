name: release

# Publishes all five packages (4 per-platform runtime deps + the main bridge) to
# npm using Trusted Publishing (OIDC) — no long-lived tokens. Triggered by pushing
# a semver tag (e.g. `git tag v1.2.2 && git push origin v1.2.2`) or manually.
#
# ONE-TIME SETUP on npmjs.com (required before the first OIDC run): for EACH of the
# five packages, open the package → Settings → Trusted Publisher, and add:
#   Provider: GitHub Actions
#   Owner / repo: dqj1998 / japan-company-info-mcp-bridge
#   Workflow filename: release.yml
#   Environment: (leave blank)
# Trusted Publishing can only be configured after a package already exists on npm,
# so the packages must be bootstrap-published once with a token first.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required: lets GitHub mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'                       # >= 22.14 required for OIDC
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - name: Version guard — tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Materialize per-platform runtime packages
        run: npm run prepare:runtime

      - name: Smoke test — every declared platform has a runnable binary
        run: npm run smoke

      # Order matters: the main package lists these as optionalDependencies.
      - name: Publish runtime sub-packages (OIDC)
        run: npm run publish:runtime
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish main package (OIDC)
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'true'
